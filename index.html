<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Go Minecraft</title>
</head>

<body>
  <h1>An Go Minecraft Server</h1>

  <p>Chào mừng đến với server Minecraft của chúng tôi!</p>

  <h2>Địa chỉ server</h2>
  <p>play.angffyt.io.vn</p>

  <button onclick="copyIP()">Copy IP</button>

  <script>
    function copyIP() {
      navigator.clipboard.writeText("play.angffyt.io.vn");
      alert("Đã copy IP server!");
    }
  </script>
</body>
